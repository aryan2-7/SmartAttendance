name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        run: brew install qt@6

      - name: Cache OpenCV build
        id: cache-opencv
        uses: actions/cache@v4
        with:
          path: $HOME/opencv-install
          key: opencv-4.10.0-macos-${{ runner.arch }}-fastbuild-v2

      - name: Download OpenCV
        if: steps.cache-opencv.outputs.cache-hit != 'true'
        run: |
          curl -L https://github.com/opencv/opencv/archive/4.10.0.zip -o opencv.zip
          unzip -q opencv.zip
          mv opencv-4.10.0 opencv

      - name: Build OpenCV
        if: steps.cache-opencv.outputs.cache-hit != 'true'
        run: |
          cmake -S opencv -B opencv-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$HOME/opencv-install \
            -DWITH_OPENBLAS=OFF \
            -DWITH_LAPACK=OFF \
            -DWITH_OBSENSOR=OFF \
            -DWITH_FFMPEG=OFF \
            -DWITH_GSTREAMER=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_PERF_TESTS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_opencv_apps=OFF \
            -DBUILD_LIST=core,imgproc,objdetect,videoio,highgui,dnn
          cmake --build opencv-build --parallel
          cmake --install opencv-build

      - name: Configure SmartAttendance
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DPACKAGING=ON \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6)" \
            -DOpenCV_DIR=$HOME/opencv-install/lib/cmake/opencv4

      - name: Build
        run: cmake --build build --config Release

      - name: Deploy Qt and package DMG
        run: |
          "$(brew --prefix qt@6)/bin/macdeployqt" build/SmartAttendance.app -no-strip
          codesign --deep --force --sign - build/SmartAttendance.app
          mkdir -p dmg_staging
          cp -R build/SmartAttendance.app dmg_staging/
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname SmartAttendance \
            -srcfolder dmg_staging \
            -ov -format UDZO \
            -imagekey zlib-level=9 \
            build/SmartAttendance.dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartAttendance-dmg
          path: build/SmartAttendance.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.0"

      - name: Install OpenCV
        shell: pwsh
        run: choco install opencv -y

      - name: Locate OpenCV config
        shell: pwsh
        run: |
          Get-ChildItem C:\tools -Recurse -Filter OpenCVConfig.cmake |
            Select-Object -ExpandProperty FullName

      - name: Configure
        shell: pwsh
        run: |
          $opencvConfig = Get-ChildItem C:\tools -Recurse -Filter OpenCVConfig.cmake |
            Select-Object -First 1 -ExpandProperty DirectoryName

          cmake -B build -DCMAKE_BUILD_TYPE=Release -DPACKAGING=ON `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DOpenCV_DIR="$opencvConfig"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Deploy Qt and OpenCV DLLs
        shell: pwsh
        run: |
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" build\Release\SmartAttendance.exe
          $opencvBin = Get-ChildItem C:\tools -Recurse -Filter opencv_world*.dll | Select-Object -First 1 -ExpandProperty DirectoryName
          if ($opencvBin) {
              Copy-Item "$opencvBin\*.dll" -Destination build\Release\
          }

      - name: Package MSI
        shell: pwsh
        working-directory: build
        run: cpack -G WIX -C Release

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartAttendance-msi
          path: build/*.msi

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: SmartAttendance-dmg
          path: release-assets/macos

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: SmartAttendance-msi
          path: release-assets/windows

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && 'nightly' || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && 'Nightly Build' || github.ref_name }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' }}
          files: |
            release-assets/macos/*.dmg
            release-assets/windows/*.msi
