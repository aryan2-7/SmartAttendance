name: Build Installers

on:
  push:
    branches: [main]

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install qt@6 opencv
      - name: Configure
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DPACKAGING=ON \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6)"
      - name: Build
        run: cmake --build build --config Release
      - name: Deploy Qt frameworks
        run: |
          $(brew --prefix qt@6)/bin/macdeployqt build/SmartAttendance.app -dmg
      - name: Package
        working-directory: build
        run: cpack
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartAttendance-macOS
          path: build/*.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.0'
      - name: Install OpenCV
        run: |
          choco install opencv -y
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DPACKAGING=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Deploy Qt DLLs
        run: |
          windeployqt build/Release/SmartAttendance.exe
      - name: Package
        working-directory: build
        run: cpack -C Release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartAttendance-Windows
          path: build/*.exe
