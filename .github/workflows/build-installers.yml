name: Build and Release

on:
  push:
    branches: [main, integration]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        run: brew install qt@6

      - name: Cache OpenCV build
        id: cache-opencv
        uses: actions/cache@v4
        with:
          path: opencv-install
          key: opencv-5.0.0-macos-${{ runner.arch }}-noopenblas

      - name: Build OpenCV from source (no OpenBLAS)
        if: steps.cache-opencv.outputs.cache-hit != 'true'
        run: |
          brew install cmake ninja
          git clone --depth 1 --branch 5.0.0 https://github.com/opencv/opencv.git
          git clone --depth 1 --branch 5.0.0 https://github.com/opencv/opencv_contrib.git
          cmake -G Ninja -B opencv-build -S opencv \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$PWD/opencv-install \
            -DWITH_OPENBLAS=OFF \
            -DWITH_LAPACK=OFF \
            -DWITH_IPP=OFF \
            -DWITH_TBB=OFF \
            -DWITH_EIGEN=OFF \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_PERF_TESTS=OFF \
            -DBUILD_opencv_world=OFF \
            -DOPENCV_EXTRA_MODULES_PATH=$PWD/opencv_contrib/modules
          cmake --build opencv-build --target install

      - name: Configure SmartAttendance
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DPACKAGING=ON \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6)" \
            -DOpenCV_DIR=$PWD/opencv-install/lib/cmake/opencv4

      - name: Build
        run: cmake --build build --config Release

      - name: Deploy Qt and package DMG
        run: |
          "$(brew --prefix qt@6)/bin/macdeployqt" build/SmartAttendance.app -no-strip
          codesign --deep --force --sign - build/SmartAttendance.app
          mkdir -p dmg_staging
          cp -R build/SmartAttendance.app dmg_staging/
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname SmartAttendance \
            -srcfolder dmg_staging \
            -ov -format UDZO \
            -imagekey zlib-level=9 \
            build/SmartAttendance.dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartAttendance-dmg
          path: build/SmartAttendance.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.0"

      - name: Install OpenCV
        shell: pwsh
        run: choco install opencv -y

      - name: Locate OpenCV config
        shell: pwsh
        run: |
          Get-ChildItem C:\tools -Recurse -Filter OpenCVConfig.cmake |
            Select-Object -ExpandProperty FullName

      - name: Configure
        shell: pwsh
        run: |
          $opencvConfig = Get-ChildItem C:\tools -Recurse -Filter OpenCVConfig.cmake |
            Select-Object -First 1 -ExpandProperty DirectoryName

          cmake -B build -DCMAKE_BUILD_TYPE=Release -DPACKAGING=ON `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DOpenCV_DIR="$opencvConfig"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Deploy Qt DLLs
        shell: pwsh
        run: |
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" build\Release\SmartAttendance.exe

      - name: Package MSI
        shell: pwsh
        working-directory: build
        run: cpack -G WIX -C Release

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartAttendance-msi
          path: build/*.msi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: SmartAttendance-dmg
          path: release-assets/macos

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: SmartAttendance-msi
          path: release-assets/windows

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/macos/*.dmg
            release-assets/windows/*.msi
