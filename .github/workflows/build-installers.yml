name: Build and Release

on:
  push:
    branches: [main, integration]
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install qt@6 opencv
      - name: Configure
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DPACKAGING=ON \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6)"
      - name: Build
        run: cmake --build build --config Release
      - name: Deploy Qt and package DMG
        run: |
          $(brew --prefix qt@6)/bin/macdeployqt build/SmartAttendance.app -no-strip
          codesign --deep --force --sign - build/SmartAttendance.app
          mkdir -p dmg_staging
          cp -R build/SmartAttendance.app dmg_staging/
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname SmartAttendance -srcfolder dmg_staging -ov -format UDZO -imagekey zlib-level=9 build/SmartAttendance.dmg
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartAttendance-macOS
          path: build/SmartAttendance.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.0'
      - name: Install OpenCV
        run: choco install opencv -y
      - name: Install WiX (for MSI packaging)
        run: choco install wixtoolset -y
      - name: Locate OpenCV CMake config
        shell: pwsh
        id: find-opencv
        run: |
          $paths = @(
            "C:\tools\opencv\build",
            "C:\ProgramData\chocolatey\lib\opencv\tools\opencv\build",
            "C:\Program Files\OpenCV\build"
          )
          foreach ($p in $paths) {
            $cfg = Join-Path $p "OpenCVConfig.cmake"
            if (Test-Path $cfg) {
              Write-Output "OPENCV_DIR=$p"
              echo "OPENCV_DIR=$p" >> $env:GITHUB_ENV
              exit 0
            }
          }
          Get-ChildItem C:\ -Recurse -Filter OpenCVConfig.cmake -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName -First 1 |
            ForEach-Object {
              $dir = Split-Path $_ -Parent
              Write-Output "OPENCV_DIR=$dir"
              echo "OPENCV_DIR=$dir" >> $env:GITHUB_ENV
            }
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DPACKAGING=ON -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}" -DOpenCV_DIR="${{ env.OPENCV_DIR }}"
      - name: Build
        run: cmake --build build --config Release
      - name: Deploy Qt DLLs
        run: windeployqt build\Release\SmartAttendance.exe
      - name: Package MSI
        working-directory: build
        run: cpack -G WIX -C Release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartAttendance-Windows
          path: build/*.msi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SmartAttendance-macOS
          path: artifacts/macos
      - uses: actions/download-artifact@v4
        with:
          name: SmartAttendance-Windows
          path: artifacts/windows
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/macos/*.dmg
            artifacts/windows/*.msi
